[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "procedure-intelligence"
version = "0.1.0"
description = "Procedure Intelligence Framework - Multi-dimensional taxonomy, formal state verification, and MCP tool orchestration for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Procedure Intelligence Framework Contributors"}
]
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
